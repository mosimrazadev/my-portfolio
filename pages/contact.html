<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/contact.css">
  <title>Document</title>
</head>
<body>
  <section id="contact" class="contact-section">
    <h2 class="contact-section-title">CONTACT</h2>
    <p class="section-subtitle">I’d love to hear from you—reach out for any opportunities or questions!</p>
  
    <div class="contact-form-container">
      <form class="contact-form" id="contactForm">
        <h3>Connect With Me 🚀</h3>
      
        <input type="email" name="email" autocomplete="off" placeholder="Your Email" required />
        <input type="text" name="name" autocomplete="off" placeholder="Your Name" required />
        <input type="text" name="subject" autocomplete="off" placeholder="Subject" required />
        <textarea name="message" placeholder="Message" rows="5" required></textarea>
      
        <!-- Hidden Inputs -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="box">
      
        <button type="submit">Send</button>
      </form>      
    </div>
  </section>

  
</body>

</html>
